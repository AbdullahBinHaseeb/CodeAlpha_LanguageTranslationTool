<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Translation Tool</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <header>
            <h1>&#127760; Language Translation Tool</h1>
            <p class="subtitle">Translate text between 12 languages &mdash; free, fast and simple.</p>
        </header>

        <section class="card">
            <form id="translate-form">
                <label for="source-text">Text to translate</label>
                <textarea id="source-text" name="text" rows="4"
                          placeholder="Type or paste your text here&hellip;" required></textarea>

                <div class="row">
                    <div class="field">
                        <label for="source-lang">From</label>
                        <select id="source-lang" name="source">
                            {% for code, name in languages.items() %}
                            <option value="{{ code }}" {% if code == default_source %}selected{% endif %}>{{ name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <button type="button" id="swap-btn" title="Swap languages">&#8646;</button>

                    <div class="field">
                        <label for="target-lang">To</label>
                        <select id="target-lang" name="target">
                            {% for code, name in languages.items() %}
                            <option value="{{ code }}" {% if code == default_target %}selected{% endif %}>{{ name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <button type="submit" id="translate-btn">Translate</button>
            </form>
        </section>

        <section class="card result-card" id="result-card" hidden>
            <div class="result-header">
                <h2 id="result-title">Translation</h2>
                <button type="button" id="copy-btn">Copy</button>
            </div>
            <p id="result-text" class="result-text"></p>
            <p id="fallback-note" class="fallback-note" hidden>Shown from the offline phrase dictionary (translation service was unreachable).</p>
        </section>

        <p id="error" class="error" hidden></p>

        <footer>
            <p>CodeAlpha AI Internship &mdash; Task 1 &middot; Abdullah Bin Haseeb (CA/DF1/321398)</p>
        </footer>
    </main>

    <script>
        const form = document.getElementById('translate-form');
        const resultCard = document.getElementById('result-card');
        const resultTitle = document.getElementById('result-title');
        const resultText = document.getElementById('result-text');
        const fallbackNote = document.getElementById('fallback-note');
        const errorBox = document.getElementById('error');
        const copyBtn = document.getElementById('copy-btn');
        const sourceLang = document.getElementById('source-lang');
        const targetLang = document.getElementById('target-lang');

        document.getElementById('swap-btn').addEventListener('click', () => {
            const tmp = sourceLang.value;
            sourceLang.value = targetLang.value;
            targetLang.value = tmp;
        });

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            errorBox.hidden = true;
            resultCard.hidden = true;
            const text = document.getElementById('source-text').value.trim();
            if (!text) {
                errorBox.textContent = 'Please enter some text to translate.';
                errorBox.hidden = false;
                return;
            }
            try {
                const response = await fetch('/translate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        text: text,
                        source: sourceLang.value,
                        target: targetLang.value
                    })
                });
                const data = await response.json();
                if (!data.ok) {
                    throw new Error(data.error || 'Translation failed.');
                }
                resultTitle.textContent =
                    data.source_language + ' \u2192 ' + data.target_language;
                resultText.textContent = data.translated_text;
                fallbackNote.hidden = !data.fallback_used;
                resultCard.hidden = false;
            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.hidden = false;
            }
        });

        copyBtn.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(resultText.textContent);
                copyBtn.textContent = 'Copied!';
                setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1500);
            } catch (err) {
                const range = document.createRange();
                range.selectNodeContents(resultText);
                const selection = window.getSelection();
                selection.removeAllRanges();
                selection.addRange(range);
                document.execCommand('copy');
                selection.removeAllRanges();
                copyBtn.textContent = 'Copied!';
                setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1500);
            }
        });
    </script>
</body>
</html>
